schema_version: 2
id: provider-plugin-release
version: 0.2.0
inputs:
  api_version: ${{ inputs.api_version }}
  base: ${{ inputs.base }}
  candidate: ${{ inputs.candidate }}
  target_directory: ${{ inputs.target_directory }}
  documents: ${{ inputs.documents }}
  request: ${{ inputs.request }}
  settings: ${{ inputs.settings }}
  merged_hash: ${{ inputs.merged_hash }}
  target_branch: ${{ inputs.target_branch }}
input_schema:
  api_version:
    type: string
    default_value: c2.build-hook/v1
  base:
    type: string
    default_value: ""
  candidate:
    type: string
    default_value: ""
  target_directory:
    type: string
    default_value: .
  documents:
    type: artifact_map
    default_value: {}
  request:
    type: string
    default_value: ""
  settings:
    type: object
    default_value: {}
  merged_hash:
    type: string
    required: true
  target_branch:
    type: string
    required: true
outputs:
  api_version: c2.build-hook/v1
  status: '${{ sequence.release.outputs.exit_code == 0 ? "passed" : "failed" }}'
  summary: '${{ sequence.release.outputs.exit_code == 0 ? "Git candidate verified. Root API is available from the published commit; SDK tagging waits for a matching root dependency pin and a separately requested release." : "Published candidate verification failed; inspect error/plugin-release.log." }}'
  artifact_refs:
    error/plugin-release.log: ${{ sequence.release.artifacts['error/plugin-release.log'] }}
sequence:
  - id: release
    op: command_execution
    inputs:
      env:
        OUTBOX: ${{ context.environment.op.outbox }}
        MERGED_HASH: ${{ inputs.merged_hash }}
        TARGET_BRANCH: ${{ inputs.target_branch }}
      run: |
        set -eu
        mkdir -p "$OUTBOX/error"
        {
          test "$(git rev-parse HEAD)" = "$MERGED_HASH"
          git check-ref-format "$TARGET_BRANCH"
          git rev-parse HEAD
          git show HEAD:go.mod
          git show HEAD:plugin/go.mod
          echo 'SDK release deferred until its root dependency is pinned to the published API.'
        } > "$OUTBOX/error/plugin-release.log" 2>&1
